export default "<form [formGroup]=\"termForm\" (ngSubmit)=\"submitTermForm()\">\r\n  <div class=\"form-group\">\r\n    <label for=\"start_date\">Wprowadź datę początkową kadencji:</label>\r\n    <input\r\n      formControlName=\"start_date\" id=\"start_date\"\r\n      type=\"date\"\r\n      class=\"form-control\" placeholder=\"Wprowadź datę\">\r\n    <span class=\"text-danger\" *ngIf=\"termForm.controls.start_date.invalid\">Wybierz/wpisz datę</span>\r\n  </div>\r\n  <div class=\"form-group\">\r\n    <label for=\"end_date\">Wprowadź datę końcową kadencji:</label>\r\n    <input\r\n      formControlName=\"end_date\" id=\"end_date\"\r\n      type=\"date\"\r\n      class=\"form-control\" placeholder=\"Wprowadź datę\">\r\n    <span class=\"text-danger\" *ngIf=\"termForm.controls.end_date.invalid\">Wybierz/wpisz datę</span>\r\n  </div>\r\n  <div class=\"form-check\">\r\n    <label class=\"form-check-label\">\r\n      <input formControlName=\"active\" type=\"checkbox\" class=\"form-check-input\" name=\"active\" id=\"active\" value=\"active\">\r\n      Czy aktywna?\r\n    </label>\r\n  </div>\r\n  <button type=\"reset\" class=\"btn btn-primary\" (click)=\"resetForm()\">Resetuj </button>\r\n  <button type=\"submit\" class=\"btn btn-primary float-right\" [disabled]=\"termForm.invalid\">{{termForm.invalid ? 'Uzupełnij pola' : 'Zapisz'}} </button>\r\n</form>\r\n"
