export default "<table class=\"table table-hover\">\n  <th>Nazwa</th>\n  <th>Wartość</th>\n  <th>Akcja</th>\n  <tr *ngFor=\"let config of configs\">\n    <td>{{config.key}}</td>\n    <td (dblclick)=\"editSettingValue($event,config.key)\">{{config.value}}</td>\n    <td [hidden]=\"true\"><span class=\"material-icons align-bottom\"> done </span> zapisz </td>\n  </tr>\n</table>\n"
