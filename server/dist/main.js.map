export default "<app-navbar *ngIf=\"user.uuid !== undefined\" [AppName]=\"title\" [jednostka]=\"configJednostka\" [navbarColor]=\"configNavbarColor\" [navbarTheme]=\"configNavbarTheme\" [userType]=\"user.role\" [UserName]=\"user.name\" [UserSurname]=\"user.surname\"></app-navbar>\r\n<div class=\"container mt-5\">\r\n  <router-outlet></router-outlet>\r\n</div>\r\n\r\n<div class=\"footer d-none d-print-block\" style=\"position: fixed; left: 0; text-align: center; bottom: 0; width: 100%;\">\r\n  <p>eRada 0.1 | {{configJednostka}}</p>\r\n</div>\r\n"
